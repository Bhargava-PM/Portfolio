<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Portfolio admin</title>
<style>
:root{--bg:#F2F5FA;--sf:#fff;--ink:#16203A;--mu:#5A6580;--ln:#D9DFEB;--ac:#2F5BEA;--ai:#fff;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0E1426;--sf:#161E36;--ink:#E8ECF8;--mu:#9AA5C3;--ln:#2A3556;--ac:#7C9BFF;--ai:#0E1426}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.box{max-width:720px;margin:0 auto;padding:22px 16px 90px}
h1{font-size:26px;margin:6px 0 10px}
.note{color:var(--mu);font-size:14px;margin:8px 0}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 0}
input,textarea{display:block;width:100%;font:inherit;color:var(--ink);padding:9px 11px;margin-top:4px;border:1px solid var(--ln);border-radius:8px;background:var(--sf)}
button{font:inherit;cursor:pointer}
.btn{background:var(--ac);color:var(--ai);border:0;border-radius:10px;padding:10px 16px;font-weight:600}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--ln)}
.btn:disabled{opacity:.5;cursor:wait}
.x{background:none;border:0;color:var(--mu);padding:2px 8px;font-size:15px}.x:hover{color:#d33}
.ag{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px;margin:12px 0}
.arow{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:6px 0}
.arow input{flex:1;min-width:140px;margin:0}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.pill{display:inline-flex;align-items:center;background:var(--bg);border:1px solid var(--ln);border-radius:999px;padding:3px 4px 3px 12px;font-size:14px}
.tabs{display:flex;gap:6px;margin:12px 0;overflow-x:auto}
.tabs button{background:none;border:1px solid var(--ln);color:var(--mu);border-radius:999px;padding:7px 14px;white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--ac);color:var(--ai);border-color:var(--ac)}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--sf);border-top:1px solid var(--ln)}
.bar small{color:var(--mu);flex:1;min-width:160px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);max-width:90vw;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
</style>
</head>
<body>
<main id="root"></main>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),root=$('#root');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),3500)};
const msg=m=>{const e=$('#m');if(e)e.textContent=m};
const lines=s=>s.split('\n').map(x=>x.trim()).filter(Boolean);
let S=null,SK,P,CERTS,tab='Skills',edit=-1,fails=0,idle;

/* ---- encrypted login vault (nothing secret is stored in the website) ---- */
const enc=new TextEncoder(),dec=new TextDecoder();
const b2s=b=>btoa(String.fromCharCode(...new Uint8Array(b))),s2b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function mkKey(u,p,salt,iter){
const km=await crypto.subtle.importKey('raw',enc.encode(u.trim().toLowerCase()+'\n'+p),'PBKDF2',false,['deriveKey']);
return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(u,p,obj){
const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),iter=600000;
const k=await mkKey(u,p,salt,iter),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,enc.encode(JSON.stringify(obj)));
localStorage.setItem('adm_vault',JSON.stringify({v:1,iter,salt:b2s(salt),iv:b2s(iv),ct:b2s(ct)}))}
async function unseal(u,p){
const v=JSON.parse(localStorage.getItem('adm_vault')),k=await mkKey(u,p,s2b(v.salt),v.iter);
return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:s2b(v.iv)},k,s2b(v.ct))))}

/* ---- GitHub ---- */
const gh=(c,path,opt,raw)=>{opt=opt||{};const h={'Accept':raw?'application/vnd.github.raw+json':'application/vnd.github+json','Authorization':'Bearer '+c.token,'X-GitHub-Api-Version':'2022-11-28'};if(opt.body)h['Content-Type']='application/json';return fetch('https://api.github.com'+path,Object.assign({},opt,{headers:h}))};
const fpath=c=>'/repos/'+encodeURIComponent(c.owner)+'/'+encodeURIComponent(c.repo)+'/contents/'+c.path.split('/').map(encodeURIComponent).join('/')+'?ref='+encodeURIComponent(c.branch);
const RE=/(<script type="application\/json" id="site-data">)([\s\S]*?)(<\/script>)/;
const b64=s=>{const b=enc.encode(s);let r='';for(let i=0;i<b.length;i+=32768)r+=String.fromCharCode.apply(null,b.subarray(i,i+32768));return btoa(r)};
async function loadSite(c){
const r=await gh(c,fpath(c));if(!r.ok)throw new Error('Could not read '+c.path+' ('+r.status+'). If your token expired, use "Forget this device" and set up again.');
const sha=(await r.json()).sha,t=await gh(c,fpath(c),{},true);if(!t.ok)throw new Error('Could not read the file ('+t.status+')');
const text=await t.text(),m=text.match(RE);if(!m)throw new Error('That file has no portfolio data block. Is it the right file?');
return{sha,text,data:JSON.parse(m[2])}}
async function saveSite(){
const c=S.cfg,cur=await loadSite(c);
const json=JSON.stringify({skills:SK,projects:P,certs:CERTS}).replace(/</g,'\\u003c');
const out=cur.text.replace(RE,(_,a,__,z)=>a+json+z);
const w=await gh(c,fpath(c).split('?')[0],{method:'PUT',body:JSON.stringify({message:'Update portfolio content',content:b64(out),sha:cur.sha,branch:c.branch})});
if(!w.ok)throw new Error('GitHub refused the update ('+w.status+')')}

/* ---- session ---- */
const bump=()=>{clearTimeout(idle);idle=setTimeout(()=>{lock();toast('Locked after 15 minutes of inactivity')},15*60*1000)};
['click','keydown'].forEach(e=>addEventListener(e,()=>{if(S)bump()}));
function lock(){S=null;SK=P=CERTS=null;clearTimeout(idle);viewLogin()}
const inp=(id,l,type,auto)=>'<label>'+l+'<input id="'+id+'" type="'+(type||'text')+'" autocomplete="'+(auto||'off')+'" spellcheck="false"></label>';

function viewSetup(){
root.innerHTML='<div class="box"><h1>Set up admin</h1><p class="note">One-time setup on this device. Your GitHub details are encrypted in this browser with your password. Nothing secret is stored in the website.</p><form id="f">'
+inp('o','GitHub username')+inp('r','Repository name')+inp('p','File to edit (usually index.html)')+inp('t','Fine-grained access token','password')
+inp('u','Choose an admin username','text','username')+inp('w','Choose a password (10+ characters)','password','new-password')+inp('w2','Confirm password','password','new-password')
+'<p class="note" id="m" role="alert"></p><button class="btn" id="go">Save and continue</button></form></div>';
$('#p').value='index.html';
$('#f').onsubmit=async e=>{e.preventDefault();
const v=id=>$('#'+id).value.trim(),pw=$('#w').value,btn=$('#go');
if(!v('o')||!v('r')||!v('t')||!v('u')||!pw){msg('Fill in every field.');return}
if(pw.length<10){msg('Use at least 10 characters for the password.');return}
if(pw!==$('#w2').value){msg('The passwords do not match.');return}
const c={owner:v('o'),repo:v('r'),path:v('p')||'index.html',token:v('t'),branch:''};
btn.disabled=true;msg('Checking with GitHub\u2026');
try{
const r=await gh(c,'/repos/'+encodeURIComponent(c.owner)+'/'+encodeURIComponent(c.repo));
if(!r.ok){msg('GitHub check failed ('+r.status+'). Check the username, repository and token.');btn.disabled=false;return}
const j=await r.json();
if(!(j.permissions&&j.permissions.push)){msg('This token cannot write to the repository.');btn.disabled=false;return}
c.branch=j.default_branch;msg('Encrypting\u2026');await seal(v('u'),pw,c);
toast('Setup done. Please log in.');viewLogin()
}catch(err){msg('Setup failed. '+(err.message||''));btn.disabled=false}}}

function viewLogin(){
root.innerHTML='<div class="box"><h1>Admin login</h1><form id="f">'+inp('u','Username','text','username')+inp('w','Password','password','current-password')
+'<p class="note" id="m" role="alert"></p><button class="btn" id="go">Log in</button></form><p class="note"><button class="x" id="forget">Forget this device</button> removes the saved login from this browser.</p></div>';
$('#forget').onclick=()=>{if(confirm('Remove the saved login from this browser? You will need your GitHub token again.')){localStorage.removeItem('adm_vault');viewSetup()}};
$('#f').onsubmit=async e=>{e.preventDefault();
const btn=$('#go');btn.disabled=true;msg('Checking\u2026');
let cfg;
try{cfg=await unseal($('#u').value,$('#w').value)}
catch(err){fails++;const wait=Math.min(30,2**fails);msg('Wrong username or password. Try again in '+wait+' seconds.');setTimeout(()=>{btn.disabled=false},wait*1000);return}
try{
msg('Loading your site\u2026');const site=await loadSite(cfg);
S={cfg};SK=site.data.skills;P=site.data.projects;CERTS=site.data.certs||[];tab='Skills';edit=-1;fails=0;$('#w').value='';bump();viewEditor()
}catch(err){msg(err.message||'Could not load the site');btn.disabled=false}}}

/* ---- editor ---- */
const toUri=file=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,1100/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/webp',.82))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)});
const fld=(id,l,v,ta)=>'<label>'+l+(ta?'<textarea id="'+id+'" rows="'+ta+'">'+esc(v)+'</textarea>':'<input id="'+id+'" value="'+esc(v)+'">')+'</label>';
function viewEditor(){
let b='';
if(tab==='Skills'){
b=Object.entries(SK).map(([k,v])=>'<div class="ag"><div class="arow"><b>'+esc(k)+'</b><button class="x" data-a="delcat" data-k="'+esc(k)+'">Delete category</button></div><div class="pills">'+v.map((s,i)=>'<span class="pill">'+esc(s)+'<button class="x" data-a="delsk" data-k="'+esc(k)+'" data-i="'+i+'" aria-label="Delete skill">\u00d7</button></span>').join('')+'</div><div class="arow"><input placeholder="Add a skill or feature" data-in="'+esc(k)+'"><button class="btn alt" data-a="addsk" data-k="'+esc(k)+'">Add</button></div></div>').join('')
+'<div class="ag"><div class="arow"><input id="newcat" placeholder="New category, e.g. Tableau"><button class="btn alt" data-a="addcat">Add category</button></div></div>';
}else if(tab==='Projects'){
const e=edit>=0?P[edit]:{t:'',tags:[],Goal:[],How:[],Output:[]};
b=P.map((p,i)=>'<div class="ag arow"><span>'+esc(p.t)+'</span><span><button class="btn alt" data-a="editp" data-i="'+i+'">Edit</button> <button class="btn alt" data-a="delp" data-i="'+i+'">Delete</button></span></div>').join('')
+'<div class="ag"><b>'+(edit>=0?'Edit project':'Add project')+'</b>'+fld('pt','Title',e.t)+fld('ptg','Tools (comma separated)',e.tags.join(', '))+fld('pg','Problem or goal (one point per line)',e.Goal.join('\n'),3)+fld('ph','What I did (one point per line)',e.How.join('\n'),4)+fld('po','Results and insights (one point per line)',e.Output.join('\n'),3)
+'<label>Screenshot (optional)<input type="file" id="pi" accept="image/*"></label>'+(e.img?'<p class="note">The current image stays unless you choose a new one. <button class="x" data-a="rmimg">Remove image</button></p>':'')
+'<div class="arow"><button class="btn" data-a="savep">'+(edit>=0?'Update project':'Add project')+'</button>'+(edit>=0?'<button class="btn alt" data-a="cancel">Cancel</button>':'')+'</div></div>';
}else{
b=CERTS.map((c,i)=>'<div class="ag arow"><span>'+esc(c.n)+(c.org?' \u00b7 '+esc(c.org):'')+'</span><button class="btn alt" data-a="delc" data-i="'+i+'">Delete</button></div>').join('')
+'<div class="ag"><b>Add certificate</b>'+fld('cn','Certificate name','')+fld('co','Issued by','')+fld('cy','Year','')+'<label>Certificate image (optional)<input type="file" id="ci" accept="image/*"></label><div class="arow"><button class="btn" data-a="savec">Add certificate</button></div></div>';
}
root.innerHTML='<div class="box"><h1>Portfolio admin</h1><div class="tabs">'+['Skills','Projects','Certificates'].map(t=>'<button data-t="'+t+'" aria-selected="'+(t===tab)+'">'+t+'</button>').join('')+'</div>'+b+'</div><div class="bar"><button class="btn" data-a="pub">Save to GitHub</button><button class="btn alt" data-a="out">Log out</button><small>Edits stay in this tab until you save. The live site updates 1 to 2 minutes after saving.</small></div>'}
root.addEventListener('click',async e=>{
const b=e.target.closest('button');if(!b||!S)return;
if(b.dataset.t){tab=b.dataset.t;edit=-1;viewEditor();return}
const a=b.dataset.a,k=b.dataset.k,i=+b.dataset.i;
try{
if(a==='out')return lock();
if(a==='pub'){b.disabled=true;toast('Saving\u2026');try{await saveSite();toast('Saved to GitHub. The site updates in 1 to 2 minutes.')}catch(err){toast(err.message||'Could not save')}b.disabled=false;return}
if(a==='delsk')SK[k].splice(i,1);
else if(a==='delcat')delete SK[k];
else if(a==='addsk'){const v=[...root.querySelectorAll('[data-in]')].find(x=>x.dataset.in===k).value.trim();if(!v)return;SK[k].push(v)}
else if(a==='addcat'){const v=$('#newcat').value.trim();if(!v||SK[v])return;SK[v]=[]}
else if(a==='delp'){P.splice(i,1);edit=-1}
else if(a==='editp'){edit=i}
else if(a==='cancel'){edit=-1}
else if(a==='rmimg'){delete P[edit].img;delete P[edit].alt}
else if(a==='savep'){
const t=$('#pt').value.trim();if(!t){toast('Add a title');return}
const f=$('#pi').files[0],old=edit>=0?P[edit]:{};
const o={t,tags:$('#ptg').value.split(',').map(x=>x.trim()).filter(Boolean),Goal:lines($('#pg').value),How:lines($('#ph').value),Output:lines($('#po').value)};
const img=f?await toUri(f):old.img;if(img){o.img=img;o.alt=t+' screenshot'}
if(edit>=0)P[edit]=o;else P.push(o);edit=-1}
else if(a==='delc')CERTS.splice(i,1);
else if(a==='savec'){
const n=$('#cn').value.trim();if(!n){toast('Add a name');return}
const f=$('#ci').files[0],o={n,org:$('#co').value.trim(),yr:$('#cy').value.trim()};
if(f)o.img=await toUri(f);CERTS.push(o)}
else return;
viewEditor()
}catch(err){toast('Something went wrong')}});
(localStorage.getItem('adm_vault')?viewLogin:viewSetup)();
</script>
</body>
</html>
